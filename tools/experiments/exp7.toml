name = "exp7"
description = """
Phase 1 re-check of phono v6's top answer for each community sample phrase. Changes since
exp6 (v5):
- v5.1 reader: a single capital ending a letter run after ≥ 2 lowercase letters is read as its
  letter name (`yurE` → "you're E", 6 of 6 clips in exp2–exp6).
- v6 scorer: deletion/insertion costs, spelling weight (0.4 → 0.52) and script risk scale
  (1.0 → 1.3) fitted by `phono fit` on exp1–exp6 (408 clips), ranking pairs of answers to the
  same phrase. Losing a sound costs more: unstressed full vowel 0.45 → 0.94, singleton
  consonant 0.7 → 1.23, onset 0.9 → 1.22. Substitution scales unchanged.
Offline (exp1–exp6): within-phrase ranking 80.0% → 86.0% in-sample, 83.1% on held-out phrases
(5-fold by phrase × 4); against Whisper-only truth 74.9% → 78.8% held out.
Only 4 answers differ from exp6: msg91 goes back to v4's `요레놑ꃚㅥy` (exp5 clip, cached);
msg14, msg171 and msg202 are new.
Same model, voice and seeds as exp1–exp6.
Cases come from `phono eval --export data/generated/ours-v6.json` (gitignored: it contains the
sample phrases).
"""
