name = "exp19"
description = """
Probe of how Flash v2.5 reads the Latin of single Hangul syllables with compound vowels (#4, PLAN.md
next steps item 5). The search builds most pseudo-words from such syllables, and the G2P (trained
on English) guesses their unidecode spellings badly: `doeg` D OW G was heard "Dag", `dyug` D AY AH G
"Jug", `kwi` K W IY "kawaii", `kweo` "cold". Each of Hangul's 16 compound vowels in 4 forms (onset
ㄷ d or ㅋ k, with or without final ㄱ g), inside the carrier "say … now": exp9 found isolated
4-letter pseudo-words too unstable to measure. Six dictionary words in the same carrier measure
the noise. `t` = what phono's reader predicts (v6, G2P 3-best). The per-word readings come from
`phono calibrate --by-word --word-dump`. Same model, voice and seeds as exp1–exp18.
"""
# Stand-in for "weeb" (Edward), which free accounts can't use via the API. See exp0.toml.
voice_id = "pNInz6obpgDQGcFmaJgB"
models = ["eleven_flash_v2_5"]
seeds = [1, 2]
max_credits = 700

# --- ae ---

[[cases]]
id = "ae_d"
text = "say 대 now"
target = "say dae now"
t = "say[S EY1] dae[D EY1] now[N AW1]"

[[cases]]
id = "ae_dg"
text = "say 댁 now"
target = "say daeg now"
t = "say[S EY1] daeg[D EY1 G] now[N AW1]"

[[cases]]
id = "ae_k"
text = "say 캐 now"
target = "say kae now"
t = "say[S EY1] kae[K EY1] now[N AW1]"

[[cases]]
id = "ae_kg"
text = "say 캑 now"
target = "say kaeg now"
t = "say[S EY1] kaeg[K EH1 G] now[N AW1]"

