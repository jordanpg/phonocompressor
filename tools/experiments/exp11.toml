name = "exp11"
description = """
Probe of Multilingual v2 (docs/PLAN.md item 7, issue #6). exp0 ran 20 cases on it at seed 1:
mostly reading model T (transliterate, read as English), with katakana read natively. This
experiment repeats exp0's cases (seed 1 is cached) at a second seed and adds what exp0 left open,
to build the model's profile:
1. Script table: hiragana, more katakana, Armenian, Cherokee, Ethiopic, Canadian syllabics, Runic,
   Hangul jamo, CJK unified and compatibility, Cyrillic, Devanagari. Which are read as their
   transliteration (T), which natively (N), which silently or as noise.
2. Reader rules Flash v2.5's profile assumes: numbers (`100.000`, digits glued to letters, `2s`),
   interior and trailing capitals (`timE`, `checkhimPC`, `tHe`), and symbols (`@ & + %`).
`t` = what phono's reader predicts (Flash v2.5's constants). Same voice as exp0-exp9.
"""
# Stand-in for "weeb" (Edward), which free accounts can't use via the API. See exp0.toml.
voice_id = "pNInz6obpgDQGcFmaJgB"
models = ["eleven_multilingual_v2"]
seeds = [1, 2]
max_credits = 250

# --- Hangul: is it read as Korean, or as its romanization? ---

[[cases]]
id = "dis_is"
text = "딧잇"
t = "dis is /dɪs ɪz/"
n = "Korean [디싣] /tisit̚/"
note = "Sample 'this is epic swag' relies on ㅅ coda = s."

[[cases]]
id = "check_him"
text = "ㅊ헻ㅋ힘"
t = "c·hec·k·him → 'check him'"
n = "chieut het kieuk him (compatibility jamo read by name)"

[[cases]]
id = "geo"
text = "거"
t = "geo /dʒioʊ/"
n = "Korean /kʌ/"
note = "Strongest single-syllable discriminator: English 'eo' vs Korean ㅓ."

[[cases]]
id = "beos"
text = "벗"
t = "beos /bioʊs/ or /boʊs/"
n = "Korean [벋] /pʌt̚/"

[[cases]]
id = "swagg"
text = "솪"
t = "swagg /swæɡ/"
n = "Korean [솩] /swak̚/"

# --- Yi (no ElevenLabs language): transliterated? and does it change its neighbours? ---

[[cases]]
id = "yi_sux"
text = "ꌟ"
t = "sux /sʌks/"
n = "— (no Yi support; silence or garbage)"

[[cases]]
id = "yi_baddream"
text = "ꀠddꏒꀊm"
t = "ba·d·d·re·a·m → 'bad dream'"
n = "—"
note = "Sample message, verbatim."

[[cases]]
id = "mix_hangul_yi"
text = "딧잇ꌟ"
t = "disissux → 'this is sucks'"
n = "Korean 디싣 + ?"
note = "Compare with dis_is: does a Yi neighbour flip Hangul to T, or the reverse?"

# --- Long transliterations: the big compression wins if T holds ---

