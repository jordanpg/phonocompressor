name = "exp10"
description = """
Probe of the codepoints where Rust `deunicode` and Python `unidecode` disagree inside scripts the
search can use (docs/PLAN.md, "Transliteration source", step 1). Kana: unidecode says shi/chi/tsu,
deunicode says si/ti/tu. Han: five characters get different readings. If the TTS follows
unidecode, add an override in crates/builder/src/translit.rs; if it follows deunicode, nothing to
do. Same model, voice and seeds as exp1-exp9.
Run 2026-11-25 (22 clips): the TTS followed unidecode on the three kana pairs and four of the five
Han characters (U+4E48, U+4EC0, U+65C5, U+672F); U+4EF7 split between the two. See docs/PLAN.md.
"""
voice_id = "pNInz6obpgDQGcFmaJgB"
models = ["eleven_flash_v2_5"]
seeds = [1, 2]
max_credits = 60

[[cases]]
id = "shi_hira"
text = "しま"
target = "shima"
t = "unidecode vs deunicode differ on し"

[[cases]]
id = "chi_hira"
text = "ちか"
target = "chika"
t = "unidecode vs deunicode differ on ち"

[[cases]]
id = "tsu_hira"
text = "つき"
target = "tsuki"
t = "unidecode vs deunicode differ on つ"

