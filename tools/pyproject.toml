[project]
name = "phono-harness"
version = "0.1.0"
description = "ElevenLabs test harness for phonocompressor: synthesize, transcribe, compare"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "torch>=2.6",
    "transformers>=4.56",
    # GPL-2.0+. Dev tooling only (shows reading-model-T predictions); never shipped in the bundle.
    "unidecode>=1.3",
]

[project.scripts]
phono-harness = "phono_harness.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long comments/strings are fine; the formatter handles code
