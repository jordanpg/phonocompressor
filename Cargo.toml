#:schema https://json.schemastore.org/cargo.json

[workspace]
resolver = "3"
members = ["crates/core", "crates/builder", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
phono-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

# The builder trains the G2P model; keep debug builds usable for it.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
