min_version = "2026.10.4"   # older mise rejects `secrets` on a task

[tools]
fnox = "latest"
rust = { version = "stable", targets = ["wasm32-unknown-unknown"] }  # wasm32 for the web tool
uv = "latest"

[settings]
experimental = true         # mise secrets is experimental

[secrets.fnox]

[env]
UV_PROJECT_ENVIRONMENT = "{{env.HOME}}/.cache/phonocompressor/tools-venv"

# --- Data file for the Rust engine (data/generated/, not committed) ---

[tasks.data]
description = "Build data/generated/phono.bin: Phoible features, CMUdict, G2P model, transliteration (deunicode)"
run = "cargo run --release -p phono-builder"

# Dev only: unidecode (GPL) output for diffing against the shipped table. Never feeds phono.bin
# unless you pass it to the builder with --translit by hand.
[tasks."dev:translit-unidecode"]
description = "Export Python unidecode's table to data/generated/translit-unidecode.tsv, for comparison only"
dir = "{{config_root}}/tools"
run = "uv run phono-harness translit-table ../data/generated/translit-unidecode.tsv"

[tasks.phono]
description = "Run the phonocompressor CLI, e.g. `mise run phono compress 'bad dream'`"
run = "cargo run --release -q -p phono-cli --"

# --- Formatting & linting (Rust: rustfmt + clippy; Python tools/: ruff) ---

[tasks.fmt]
description = "Format all code (rustfmt + ruff format + ruff import sorting)"
run = [
  "cargo fmt --all",
  "uvx ruff format tools",
  "uvx ruff check --select I --fix tools",
]

[tasks."fmt:check"]
description = "Check formatting without changing files (for CI)"
run = [
  "cargo fmt --all --check",
  "uvx ruff format --check tools",
]

[tasks.lint]
description = "Lint: clippy (warnings are errors) + ruff check"
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "uvx ruff check tools",
]

# --- WASM (web tool, Phase 3) ---

[tasks."check:wasm"]
description = "Check that phono-core builds for wasm32-unknown-unknown (the target comes from `mise install`)"
run = "cargo build -p phono-core --target wasm32-unknown-unknown"

# --- ElevenLabs test harness (tools/). Only tasks that call the API receive the key. ---

[tasks."harness:credits"]
description = "Show ElevenLabs credit usage this period (free API call)"
secrets = ["ELEVENLABS_API_KEY"]
dir = "{{config_root}}/tools"
run = "uv run phono-harness credits"

[tasks."harness:models"]
description = "List ElevenLabs TTS models and cost multipliers (free API call)"
secrets = ["ELEVENLABS_API_KEY"]
dir = "{{config_root}}/tools"
run = "uv run phono-harness models"

[tasks."harness:voices"]
description = "List voices this account can use (free API call)"
secrets = ["ELEVENLABS_API_KEY"]
dir = "{{config_root}}/tools"
run = "uv run phono-harness voices"

[tasks."harness:synth"]
description = "Synthesize an experiment's uncached clips: dry run unless --spend"
secrets = ["ELEVENLABS_API_KEY"]
dir = "{{config_root}}/tools"
run = "uv run phono-harness synth"

[tasks."harness:transcribe"]
description = "Run local ASR (Whisper + wav2vec2 phones) on an experiment's cached clips"
dir = "{{config_root}}/tools"
run = "uv run phono-harness transcribe"

[tasks."harness:export"]
description = "Export transcribed clips with targets for `phono calibrate` (gitignored output)"
dir = "{{config_root}}/tools"
run = "uv run phono-harness export-clips exp1 exp2 --out ../data/generated/clips.tsv"

[tasks."harness:report"]
description = "Write a markdown report for an experiment to tools/results/"
dir = "{{config_root}}/tools"
run = "uv run phono-harness report"
